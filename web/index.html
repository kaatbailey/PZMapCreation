<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PZ Map Placement</title>
    <link rel="stylesheet" href="map.css">
</head>
<body>

<div id="app">http://localhost:8080/generated/vanilla-world.png

    <header>
        <div>
            <h1>PZ Map Placement</h1>
            <span>Vanilla World — Phase 1</span>
        </div>

        <div id="status">
            Loading map...
        </div>
    </header>

    <main id="map-container">
        <canvas id="map"></canvas>

        <div id="coordinates">
            <div class="coordinate-title">World Position</div>

            <div class="coordinate-row">
                <span>World X</span>
                <strong id="world-x">—</strong>
            </div>

            <div class="coordinate-row">
                <span>World Y</span>
                <strong id="world-y">—</strong>
            </div>

            <hr>

            <div class="coordinate-row">
                <span>Cell X</span>
                <strong id="cell-x">—</strong>
            </div>

            <div class="coordinate-row">
                <span>Cell Y</span>
                <strong id="cell-y">—</strong>
            </div>

            <div class="coordinate-row">
                <span>Local X</span>
                <strong id="local-x">—</strong>
            </div>

            <div class="coordinate-row">
                <span>Local Y</span>
                <strong id="local-y">—</strong>
            </div>
        </div>

        <div id="clicked-coordinate">
            Click the map to lock a coordinate
        </div>
    </main>

</div>

<script src="map.js"></script>

</body>
</html>
